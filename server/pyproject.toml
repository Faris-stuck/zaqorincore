[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zaqorincore-server"
version = "1.7.4"
description = "ZaqorinCore central server — FastAPI app that accepts agent WebSocket streams, persists events to PostgreSQL, fans out through Redis Streams, runs Sigma-compatible detection, and emits SOAR actions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Faris-stuck", email = "Faris-stuck@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # Web framework
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.32,<0.34",
    "websockets>=15,<16",
    # Config + validation
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Database
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    # Redis
    "redis[hiredis]>=5.2,<6",
    # Logging
    "structlog>=24.4,<25",
    # Misc
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<0.29",  # for tests
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "psycopg[binary]>=3.2",
    "pytest-cov>=6,<7",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[project.scripts]
zaqorin-server = "zaqorincore_server.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = ["asyncio(loop_scope): pytest-asyncio marker with loop scope"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

title: Login with default administrator account (PCI DSS 2.2.2)
id: d9e78aa2-04fb-4c16-96c2-25c67b09f302
description: Detects logins using default vendor accounts such as admin or root.
  PCI DSS 4.0 requirement 2.2.2 requires vendor-supplied defaults to be changed
  before deployment.
author: Zaqor Security
date: 2026-08-28
modified: 2026-08-28
references:
  - https://www.pcisecuritystandards.org/document_library
tags:
  - attack.t1078.001
  - pci_dss.2.2.2
level: critical
detection:
  selection:
    event_type: auth_login
    user|re: '^(admin|root|administrator|sa)$'
  condition: selection
  timeframe: 10m
  count: 1
cooldown_sec: 1800
dedup_key: "{{user}}"

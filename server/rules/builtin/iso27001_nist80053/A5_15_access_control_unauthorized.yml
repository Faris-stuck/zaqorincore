title: Multiple failed authentication attempts from one source
id: 9f492405-3f00-4036-ba1b-dadf06b6b682
description: >
  Detects 5 or more failed logins from the same source within 5 minutes,
  indicating a brute force or password-spray attempt. Maps to ISO
  27001:2022 A.5.15 (access control) and NIST SP 800-53 AC-7
  (unsuccessful logon attempts).
author: ZaqorinCore
date: 2026/08/28
modified: 2026/08/28
references:
  - https://www.iso.org/standard/27001
  - https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search
tags:
  - iso27001.A.5.15
  - nist80053.AC-7
  - attack.credential_access
  - attack.brute_force
level: high
detection:
  selection:
    event_type: "auth_login"
    status: "failed"
  condition: selection
  timeframe: 5m
  count: 5
cooldown_sec: 600
dedup_key: "{{source_ip}}"

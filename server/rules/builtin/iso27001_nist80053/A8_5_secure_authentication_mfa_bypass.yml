title: Multi-factor authentication disabled for account
id: 07987d74-eb2a-4a2b-ba56-0bda77009fcc
description: >
  Detects when MFA is removed, disabled, or bypassed for a user
  account. Removing MFA on a privileged or remote-access account
  degrades the authentication posture and frequently precedes
  account takeover. Maps to ISO 27001:2022 A.8.5 (secure
  authentication) and NIST SP 800-53 IA-2(1) (multi-factor
  authentication).
author: ZaqorinCore
date: 2026/08/28
modified: 2026/08/28
references:
  - https://www.iso.org/standard/27001
  - https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search
tags:
  - iso27001.A.8.5
  - nist80053.IA-2(1)
  - attack.defense_evasion
  - attack.t1556
level: critical
detection:
  selection:
    event_type: "mfa_state"
    mfa_enabled: "false"
  condition: selection
  timeframe: 10m
cooldown_sec: 1800
dedup_key: "{{user}}"

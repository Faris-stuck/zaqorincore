title: Mass file deletion by privileged account
id: 3a989b96-3091-48ca-a114-7e750545a871
description: >
  Detects root or another privileged account running rm, find -delete,
  or shred against many user-owned files in a short window. Mass
  deletion by a privileged account may indicate evidence destruction,
  insider sabotage, or ransomware operator activity. Maps to ISO
  27001:2022 A.5.31 (legal, statutory, regulatory and contractual
  requirements) and NIST SP 800-53 SI-12 (information handling and
  retention).
author: ZaqorinCore
date: 2026/08/28
modified: 2026/08/28
references:
  - https://www.iso.org/standard/27001
  - https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search
tags:
  - iso27001.A.5.31
  - nist80053.SI-12
  - attack.impact
  - attack.t1485
level: critical
detection:
  selection:
    event_type: "process_exec"
    user: "root"
    command: 're:(rm\s+-rf|find\s+.*-delete|shred\s+.*-u)'
  condition: selection
  timeframe: 5m
  count: 5
cooldown_sec: 1800
dedup_key: "{{user}}"

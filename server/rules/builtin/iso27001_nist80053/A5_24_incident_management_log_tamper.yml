title: Log truncation or clearing
id: 73ad10ac-6618-44ab-91ac-1febe565d970
description: >
  Detects when log files are truncated, cleared, or removed. This
  includes truncate, redirect, and rm on active log files. Maps to ISO
  27001:2022 A.5.24 (incident management planning) and NIST SP 800-53
  AU-9 (protection of audit information).
author: ZaqorinCore
date: 2026/08/28
modified: 2026/08/28
references:
  - https://www.iso.org/standard/27001
  - https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search
tags:
  - iso27001.A.5.24
  - nist80053.AU-9
  - attack.defense_evasion
  - attack.t1070
level: critical
detection:
  selection:
    event_type: "process_exec"
    command: 're:(truncate\s+.*\.log|>\s*/var/log/|rm\s+.*\.(log|evtx)|echo\s+>\s*/var/log/)'
  condition: selection
  timeframe: 10m
cooldown_sec: 1800
dedup_key: "{{user}}"

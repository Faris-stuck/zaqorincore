title: Unauthorized service started
id: e8a20f9b-3989-499b-b62a-3794696712c0
description: >
  Detects service start events for binaries that are not on the
  approved service list. Allowing unapproved services to run expands
  the attack surface and may violate the configuration baseline.
  Maps to ISO 27001:2022 A.5.36 (compliance with policies and
  standards) and NIST SP 800-53 CM-7 (least functionality).
author: ZaqorinCore
date: 2026/08/28
modified: 2026/08/28
references:
  - https://www.iso.org/standard/27001
  - https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search
tags:
  - iso27001.A.5.36
  - nist80053.CM-7
  - attack.execution
  - attack.t1543
level: medium
detection:
  selection:
    event_type: "service_state"
    state: "started"
    approved: "false"
  condition: selection
  timeframe: 10m
cooldown_sec: 1800
dedup_key: "{{service}}"

title: Pemrosesan data di luar tujuan yang dinyatakan (Pasal 37 UU PDP)
id: builtin-uu-pdp-pasal37-pemrosesan-melanggar
description: >
  Mendeteksi aktivitas pemrosesan data pribadi yang tidak sesuai
  dengan tujuan yang telah disampaikan kepada pemilik data. Pasal 37
  UU PDP melarang penggunaan data di luar tujuan yang telah
  disetujui pemilik data.

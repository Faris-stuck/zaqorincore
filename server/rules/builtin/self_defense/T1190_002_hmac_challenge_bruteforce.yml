title: T1190.002 — WS HMAC challenge failures burst from single src_ip
id: 554a2ed6-8ad6-4fdc-9cf9-f2a9b74b2a64
status: experimental
description: |
  Detects a burst of failed HMAC challenges on /ws/agent from a
  single source IP. 10 failures inside a 60-second window is a
  strong signal of a brute-force attempt against the HMAC
  challenge secret (the v3.2.1 fix added the challenge-response;
  this rule fires when an attacker is guessing).

  Maps to F-1 v3.2.1 (HMAC challenge-response). The threshold
  is generous to absorb clock-skew and small network glitches;
  legitimate agents that repeatedly fail should be investigated
  for misconfiguration rather than whitelisted.
references:
  - https://github.com/Faris-stuck/zaqorincore/security/advisories
author: ZaqorinCore
date: 2026/09/04
modified: 2026/09/04
tags:
  - attack.initial_access
  - attack.t1190
  - attack.exploitation_for_external_facing
logsource:
  product: zaqorincore
  service: server
detection:
  selection:
    event_type: ws.hello
    auth_method: hmac
    status: 401
  condition: selection
  timeframe: 60s
  count: 10
  by: src_ip
fields:
  - src_ip
  - key_id
falsepositives:
  - Clock skew on the agent causing legitimate failures
  - Agent rebooting repeatedly inside the window
  - Misconfigured agent with rotated secret not yet propagated
level: medium

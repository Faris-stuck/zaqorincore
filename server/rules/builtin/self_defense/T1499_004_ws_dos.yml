title: T1499.004 — WS frame size or rate limit exceeded
id: d247b3d1-6db7-4c43-b16c-c0d2bfa1a458
status: experimental
description: |
  Detects DoS attempts against /ws/agent (F-009 from AUDIT-2026-09-03).
  Fires when the WS guard rejects >=5 frames from the same src_ip
  in a 1-minute window with trigger in
  {frame_size_exceeded, rate_limit_exceeded}.

  Threshold tuned to one full reconnect-and-spam cycle of an
  abusive client while still ignoring benign reconnects.
references:
  - https://github.com/Faris-stuck/zaqorincore/security/advisories
author: ZaqorinCore
date: 2026/09/03
modified: 2026/09/03
tags:
  - attack.impact
  - attack.t1499
  - attack.endpoint_dos
logsource:
  product: zaqorincore
  service: server
detection:
  selection:
    event_type: ws.dos
    trigger:
      - frame_size_exceeded
      - rate_limit_exceeded
  condition: selection
  timeframe: 1m
  count: 5
fields:
  - src_ip
  - agent_id
  - trigger
  - frame_size_bytes
falsepositives:
  - Misconfigured agent repeatedly sending oversized heartbeat frames (single src_ip, easy to whitelist)
level: high
title: Windows user account created (off-hours)
id: builtin-windows-4720-account-create
description: |
  Detects a new user account being created (Event ID 4720)
  during off-hours: outside the business-hours window
  09:00-17:00 local time.

  Every new account is a potential persistence mechanism
  (ATT&CK T1136 Create Account) for an attacker who has
  already obtained Domain Admin or local Administrator
  credentials. Off-hours is the strongest signal of
  malicious intent — legitimate onboarding is performed
  during business hours by HR / IT staff.

  The agent must populate `metadata.hour` (0-23) on the
  event from the local clock at the time the event was
  received. The Windows collector (v1.2.0) populates
  this from the event's TimeGenerated field.

  Operators who want to broaden the rule (e.g. fire on
  all 4720 events regardless of hour) can override in
  `rules.local_overrides/` and remove the off-hours
  condition.

  v1.4.0 shipped this rule firing 24x7 because the
  engine couldn't parse `selection and not filter`.
  v1.4.y adds compound condition parsing (ADR-010) and
  narrows the rule to off-hours.

  Mapping:
    ATT&CK T1136 (Create Account)
    ATT&CK T1136.001 (Local Account)
    ATT&CK T1136.002 (Domain Account)
    PCI DSS 8.1.4 (Disable / remove inactive accounts
      within 90 days)
    ISO 27001 A.5.16 (Identity management)
tags:
  - attack.t1136
  - attack.t1136.001
  - attack.t1136.002
  - attack.persistence
  - compliance.pci_dss.req8
  - compliance.iso27001.A5.16
references:
  - https://attack.mitre.org/techniques/T1136/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4720
level: high
required_fields:
  - metadata.hour
detection:
  selection:
    source: "windows.security.4720"
  filter_business_hours:
    metadata.hour:
      - "9"
      - "10"
      - "11"
      - "12"
      - "13"
      - "14"
      - "15"
      - "16"
      - "17"
  condition: selection and not filter_business_hours
action:
  kind: snapshot_processes
  target: "{{pid}}"
  ttl_sec: 0
cooldown_sec: 3600
dedup_key: "{{target_user_name}}"

title: Windows user added to privileged group (Domain Admins / Enterprise Admins)
id: builtin-windows-4732-priv-group-add
description: |
  Detects a member being added to a privileged security-
  enabled group (Event ID 4732). The rule scopes to the
  three groups that an attacker must compromise to fully
  own an Active Directory domain:
    - Domain Admins (S-1-5-32-548)
    - Enterprise Admins (S-1-5-32-549)
    - Schema Admins (S-1-5-32-551)
  plus the local Administrators group (BUILTIN\Administrators,
  S-1-5-32-544). A non-admin user added to one of these
  groups is either a misconfiguration (worth surfacing) or
  a privilege-escalation attack (worth alerting on).

  Implementation note: the current rule-engine selection
  matches on event metadata list membership. Operators
  with deeper Active Directory instrumentation can
  switch to a `contains:` match on the target_sid
  substring for the four well-known RIDs.

  Mapping:
    ATT&CK T1098 (Account Manipulation)
    ATT&CK T1078.002 (Valid Accounts: Domain Accounts)
    PCI DSS 7.1 (Restrict access to system components)
    ISO 27001 A.5.15 (Access control)
    NIST 800-53 AC-6 (Least Privilege)
tags:
  - attack.t1098
  - attack.persistence
  - attack.privilege_escalation
  - compliance.pci_dss.req7
  - compliance.iso27001.A5.15
  - compliance.nist_800_53.ac.6
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4732
level: critical
detection:
  selection:
    source: "windows.security.4732"
    target_sid:
      - "EXAMPLE-S-1-5-32-544"  # BUILTIN\Administrators
      - "EXAMPLE-S-1-5-32-548"  # Domain Admins
      - "EXAMPLE-S-1-5-32-549"  # Enterprise Admins
      - "EXAMPLE-S-1-5-32-551"  # Schema Admins
  condition: selection
action:
  kind: snapshot_processes
  target: "{{pid}}"
  ttl_sec: 0
cooldown_sec: 0
dedup_key: "{{target_sid}}:{{member_sid}}"

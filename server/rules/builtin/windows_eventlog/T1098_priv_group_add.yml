title: Windows user added to privileged group (T1098)
id: builtin-windows-4732-priv-group-add
description: |
  Detects a member being added to a privileged AD group
  (Event ID 4732). The list of monitored groups covers
  both Domain-level high-value groups (Domain Admins,
  Enterprise Admins, Schema Admins, Account Operators,
  Server Operators, Print Operators, Backup Operators)
  AND BUILTIN\Administrators. This is the v1.4.y version
  of the v1.4.0 rule — v1.4.0 covered only the 4
  Domain-level groups; v1.4.y adds Account Operators,
  Server Operators, Print Operators, Backup Operators
  (which are also high-value targets for an attacker
  who has compromised a privileged user), AND scopes
  the rule via OR compound conditions (ADR-010) to fire
  only when the group is in the list.

  Real-world abuse: the "Skeleton Key" and "DCShadow"
  attacks both require addition to one of these groups
  for persistence. The rule fires immediately on any
  4732 event where the target group matches, with a
  10-minute cooldown per (host, target_group, member)
  tuple.

  Detection:
    - source == "windows.security.4732"
    - target_group_name in [Domain Admins, Enterprise
      Admins, Schema Admins, Account Operators, Server
      Operators, Print Operators, Backup Operators,
      BUILTIN\Administrators]
  Required GPO: "Audit Security Group Management"
  must be enabled (Success).

  Mapping:
    ATT&CK T1098 (Account Manipulation)
    ATT&CK T1098.001 (Additional Cloud Credentials)
      — analogous AD technique
    PCI DSS 7.2.2 (Privileged access assigned only to
      need-to-know)
    ISO 27001 A.5.18 (Access rights)
    NIST 800-53 AC-6 (Least Privilege)
tags:
  - attack.t1098
  - attack.t1098.001
  - attack.persistence
  - attack.privilege_escalation
  - compliance.pci_dss.req7
  - compliance.iso27001.A5.18
  - compliance.nist_800_53.AC-6
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4732
level: high
detection:
  selection:
    source: "windows.security.4732"
    target_group_name:
      - "Domain Admins"
      - "Enterprise Admins"
      - "Schema Admins"
      - "Account Operators"
      - "Server Operators"
      - "Print Operators"
      - "Backup Operators"
      - "BUILTIN\\Administrators"
  condition: selection
action:
  kind: snapshot_processes
  target: "{{pid}}"
  ttl_sec: 0
cooldown_sec: 600
dedup_key: "{{target_group_name}}:{{member_name}}"

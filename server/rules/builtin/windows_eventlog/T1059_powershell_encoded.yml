title: Windows PowerShell EncodedCommand (T1059.001)
id: builtin-windows-4688-powershell-encoded
description: |
  Detects a PowerShell-launched process (Event ID 4688)
  whose command line contains the `EncodedCommand` (or
  `-Enc` / `-E `) flag. The encoded form is the standard
  bypass for command-line logging because it accepts a
  Base64-encoded command string that won't be picked up
  by simple keyword search. Real-world PowerShell payload
  frameworks (PowerSploit, Cobalt Strike, Empire) ship
  with `-EncodedCommand` baked in.

  v1.4.0 deferred this rule (no `|startswith` modifier
  support). v1.4.x shipped the modifier. v1.4.y adds
  the PowerShell-only parent-process scope via OR
  compound conditions (ADR-010): the parent process
  must be `powershell.exe` OR `pwsh.exe`, ensuring
  the rule fires only on actual PowerShell launches
  (not on any process whose command line happens to
  contain the literal "EncodedCommand").

  Detection:
    - source == "windows.security.4688"
    - command_line contains "EncodedCommand" or "-Enc "
      or " -E "
    - parent_process_name in [powershell.exe, pwsh.exe]
  Required GPO: "Include command line in process
  creation events" must be enabled (see
  PHASE12-windows.md).

  Mapping:
    ATT&CK T1059.001 (PowerShell)
    ATT&CK T1027 (Obfuscated Files or Information)
    ATT&CK T1140 (Deobfuscate/Decode Files or
      Information)
    PCI DSS 10.2.1 (Audit logs capture individual user
      access)
    ISO 27001 A.5.7 (Threat intelligence)
tags:
  - attack.t1059.001
  - attack.t1027
  - attack.t1140
  - attack.execution
  - attack.defense_evasion
  - compliance.pci_dss.req10
  - compliance.iso27001.A5.7
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1140/
level: high
detection:
  selection:
    source: "windows.security.4688"
    command_line: "contains:EncodedCommand"
  filter_parent_powershell:
    parent_process_name: "powershell.exe"
  filter_parent_pwsh:
    parent_process_name: "pwsh.exe"
  condition: selection and (filter_parent_powershell or filter_parent_pwsh)
action:
  kind: snapshot_processes
  target: "{{pid}}"
  ttl_sec: 0
cooldown_sec: 600
dedup_key: "{{pid}}"

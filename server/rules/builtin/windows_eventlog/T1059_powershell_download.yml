title: Windows PowerShell remote download (T1059.001 / T1105)
id: builtin-windows-4688-powershell-download
description: |
  Detects a PowerShell-launched process (Event ID 4688)
  whose command line uses a remote-download cmdlet:
  `DownloadString`, `DownloadFile`, `DownloadData`,
  `Invoke-WebRequest` (iwr), or `Invoke-RestMethod`
  (irm). These are the standard cmdlets used by
  attacker frameworks (PowerSploit, Cobalt Strike,
  Empire) to stage second-stage payloads from
  attacker-controlled infrastructure.

  v1.4.0 deferred this rule (no `|contains` substring
  modifier support). v1.4.x shipped the modifier.
  v1.4.y adds the PowerShell-only parent-process scope
  via OR compound conditions (ADR-010): the parent
  process must be `powershell.exe` OR `pwsh.exe`.

  Mapping:
    ATT&CK T1059.001 (PowerShell)
    ATT&CK T1105 (Ingress Tool Transfer)
    PCI DSS 10.2.1 (Audit logs capture individual user
      access)
    ISO 27001 A.5.7 (Threat intelligence)
tags:
  - attack.t1059.001
  - attack.t1105
  - attack.execution
  - attack.command_and_control
  - compliance.pci_dss.req10
  - compliance.iso27001.A5.7
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1105/
level: high
detection:
  selection:
    source: "windows.security.4688"
    command_line: "contains:DownloadString"
  filter_parent_powershell:
    parent_process_name: "powershell.exe"
  filter_parent_pwsh:
    parent_process_name: "pwsh.exe"
  condition: selection and (filter_parent_powershell or filter_parent_pwsh)
action:
  kind: snapshot_processes
  target: "{{pid}}"
  ttl_sec: 0
cooldown_sec: 600
dedup_key: "{{pid}}"

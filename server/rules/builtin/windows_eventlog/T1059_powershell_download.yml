title: Windows process spawning a remote download (T1059.001 / T1105)
id: builtin-windows-4688-powershell-download
description: |
  Detects a process (Event ID 4688) whose command line
  contains a remote-download cmdlet. Covers PowerShell
  `DownloadString`, `DownloadFile`, `DownloadData`,
  `Invoke-WebRequest` (iwr), and `Invoke-RestMethod` (irm) —
  the standard set of cmdlets used by attacker frameworks
  (PowerSploit, Cobalt Strike, Empire) to stage second-stage
  payloads.

  The v1.4.0 release deferred this rule because the engine
  lacked the `|contains` substring modifier support. v1.4.x
  ships the modifier (ADR-009) and this rule together.

  Scope limitation: like the T1059.001 EncodedCommand rule,
  this rule matches on the cmdline flag string. It will
  fire on any process whose command line happens to contain
  "DownloadString" (e.g. a curl command with that in the
  URL). For a stricter PowerShell-only scope, override in
  `rules.local_overrides/` with a `parent_process_name:
  powershell.exe` clause.

  Mapping:
    ATT&CK T1059.001 (PowerShell)
    ATT&CK T1105 (Ingress Tool Transfer)
    PCI DSS 10.2.1 (Audit logs capture individual user access)
    ISO 27001 A.5.7 (Threat intelligence)
tags:
  - attack.t1059.001
  - attack.t1105
  - attack.execution
  - attack.command_and_control
  - compliance.pci_dss.req10
  - compliance.iso27001.A5.7
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1105/
level: high
detection:
  selection:
    source: "windows.security.4688"
    command_line: "contains:DownloadString"
  condition: selection
action:
  kind: snapshot_processes
  target: "{{pid}}"
  ttl_sec: 0
cooldown_sec: 600
dedup_key: "{{pid}}"

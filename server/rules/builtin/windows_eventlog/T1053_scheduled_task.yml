title: Windows Scheduled Task created
id: builtin-windows-4698-scheduled-task
description: |
  Detects creation of a new scheduled task
  (Event ID 4698). Scheduled tasks are a common
  persistence (ATT&CK T1053.005) and execution
  (T1053) mechanism — an attacker can create
  a task that runs a payload on a schedule or
  at logon.

  Not narrowed to off-hours because legitimate
  IT automation creates tasks during business
  hours. Operators should baseline the volume
  of 4698 events per host and tune
  `cooldown_sec` accordingly.

  Mapping:
    ATT&CK T1053.005 (Scheduled Task)
    ATT&CK T1053 (Scheduled Task/Job)
    PCI DSS 8.2.3 (Privileged account
      management)
    ISO 27001 A.8.18 (Use of privileged
      utility programs)
tags:
  - attack.t1053.005
  - attack.t1053
  - attack.persistence
  - attack.execution
  - attack.privilege_escalation
  - compliance.pci_dss.req8
  - compliance.iso27001.A8.18
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4698
level: medium
detection:
  selection:
    source: "windows.security.4698"
  condition: selection
action:
  kind: snapshot_processes
  target: "{{pid}}"
  ttl_sec: 0
cooldown_sec: 60
dedup_key: "{{task_name}}"

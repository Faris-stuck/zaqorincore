title: CDN credential stuffing burst (51+ requests/min to login API)
id: ba44236a-fab7-4585-be79-f5a2750f3c2a
description: |
  Flags a high-rate burst of requests against the auth login API
  from a single source IP. Typical signature of credential
  stuffing, where an attacker submits many username/password
  pairs in rapid succession against the same endpoint.
  Limitation: the current Sigma engine in ZaqorinCore does not
  support a distinct(UserAgent) aggregate, so this rule fires on
  rate alone. Operators who need the varied-UA characteristic
  (a single-UA hammering client is sometimes a slow brute force)
  should layer a follow-up rule that cross-checks the burst
  against an HTTP-user-agent distinct count from event
  metadata, or use a downstream correlator.
author: ZaqorinCore
date: 2026-08-30
modified: 2026-08-30
references:
  - https://attack.mitre.org/techniques/T1110/  # Brute Force
  - https://attack.mitre.org/techniques/T1110.004/  # Credential Stuffing
tags:
  - attack.t1110
  - attack.credential_access
  - cdn.edge
level: high
detection:
  selection:
    source: "cloudflare_logpush"
    uri: 're:(?i)/api/auth/login'
  condition: selection
  timeframe: 1m
  count: 51
action:
  kind: block_ip
  target: "{{src_ip}}"
  ttl_sec: 3600
cooldown_sec: 600
dedup_key: "{{src_ip}}"
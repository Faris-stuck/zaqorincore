title: Outbound HTTP(S) from non-browser process (Application Layer Protocol)
id: 9f3a4b21-7c8e-4d1a-b6f5-2a8c4e9d0b73
description: |
  Detects outbound HTTP/HTTPS requests made by processes that are not
  legitimate user-facing web browsers. Adversaries commonly tunnel command
  and control (C2) traffic over HTTP/HTTPS using built-in utilities
  (curl, wget) or scripting language interpreters (python, perl, ruby,
  php). This rule covers MITRE T1071.001 (Web Protocols). Legitimate
  package managers, browsers, and runtime helpers (node package
  managers, snap, flatpak) are excluded to suppress false positives.
author: ZaqorinCore
date: 2026-08-30
modified: 2026-08-30
references:
  - https://attack.mitre.org/techniques/T1071/
  - https://attack.mitre.org/techniques/T1071/001/
tags:
  - attack.t1071
  - attack.t1071.001
  - attack.command_and_control
  - nist_csf.DE.CM
level: high
detection:
  selection:
    event_type: "process_create"
    command: 're:(?i)(^|\s)(curl|wget|fetch|python[0-9.]*|perl|ruby|php|node|nc|ncat|socat|bash\s+-c|sh\s+-c|zsh\s+-c)\s+.*(https?://|\s--connect-only|\s--proxy)\S*'
  filter_legit:
    process: 're:(?i)\b(apt|apt-get|dpkg|yum|dnf|rpm|apk|pacman|snap|flatpak|brew|pip|npm|yarn|cargo|gem|chromium|chrome|firefox|safari|edge|opera|webkit)\b'
    command: 're:(?i)(/var/lib/dpkg|/var/lib/rpm|/var/cache/apt|/var/cache/dnf|/usr/local/bin/(setup|install)\.sh|--update|-U|--refresh)'
  condition: selection and not filter_legit
  timeframe: 24h
  count: 1
cooldown_sec: 1800
dedup_key: "{{user}}:{{process}}"
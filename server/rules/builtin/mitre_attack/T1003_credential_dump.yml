title: LSASS read or /proc/*/mem access (credential dump)
id: ed67f98a-c86d-4b19-8b71-7b8f18674b7b
description: Detects reads of lsass.exe handle or /proc/*/mem opens that target credential stores.
author: ZaqorinCore
date: 2026-08-28
modified: 2026-08-28
references:
  - https://attack.mitre.org/techniques/T1003/
  - https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
tags:
  - attack.t1003
  - attack.credential_access
  - nist_csf.DE.CM
level: critical
detection:
  selection:
    event_type: "process_access"
    target_file: 're:(?i)(lsass\.exe|/proc/\d+/mem)'
  condition: selection
cooldown_sec: 1800
dedup_key: "{{user}}:{{source_ip}}"

title: World-readable .ssh/id_rsa or credential file
id: 6dd09b45-2114-4640-b8d7-06501d1ca7d7
description: Detects SSH private keys or .pem files with mode 0644 or 0664 on Linux/macOS.
author: ZaqorinCore
date: 2026-08-28
modified: 2026-08-28
references:
  - https://attack.mitre.org/techniques/T1552/
  - https://attack.mitre.org/techniques/T1552/001/
  - https://attack.mitre.org/techniques/T1552/004/
tags:
  - attack.t1552
  - attack.credential_access
  - nist_csf.PR.DS
level: high
detection:
  selection:
    event_type: "file_meta"
    filename: 're:(\.ssh/id_(rsa|ecdsa|ed25519)\b|\.aws/credentials\b|\.pem\b)'
    mode: 're:^0[236]44$'
  condition: selection
cooldown_sec: 86400
dedup_key: "{{filename}}:{{hostname}}"

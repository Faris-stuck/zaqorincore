title: Password guessing via common credentials or brute-force tools (T1110.001)
id: 4f7c2e8b-9a13-4d56-8e2a-1b6d5c9f0e34
description: |
  Detects password guessing attacks against a single account. T1110.001
  is distinct from generic T1110 brute force: it covers targeted
  dictionary-style guessing where an attacker hammers one username with
  many passwords (or one password against many usernames), uses known
  brute-force tooling (hydra, medusa, ncrack, patator, crowbar), or
  cycles through common default passwords (admin/password, root/toor,
  test/test). Volume-based detection (T1110) catches high-rate failures;
  this rule catches the qualitative signal that the credentials being
  attempted look like dictionary guesses, not real-world typos.

  Two anchors combine for high precision:
    - command: brute-force tool names anchored at word boundary
    - user OR password: known default-credential strings anchored

  Legitimate authentication services (sudo, sshd with public key only,
  pam_google_authenticator) are excluded to keep noise low in production.
author: ZaqorinCore
date: 2026-08-30
modified: 2026-08-30
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://owasp.org/www-community/attacks/Brute_force_attack
  - https://github.com/vanhauser-thc/thc-hydra
tags:
  - attack.t1110.001
  - attack.credential_access
  - nist_csf.DE.CM
level: high
detection:
  selection:
    event_type: "auth_login"
    status: "failed"
  selection_bruteforce_tool:
    command: 're:(?i)(?<![A-Za-z0-9_])(hydra|medusa|ncrack|patator|crowbar|brutessh|hydra-gtk)(?![A-Za-z0-9_])'
  selection_default_credential:
    user: 're:(?i)(^|\b)(admin|root|administrator|sa|guest|default|test|user|operator|support|ubnt|pi|ftp)([\b$]|$)'
    password: 're:(?i)(^|\b)(admin|root|toor|password|passw0rd|123456|qwerty|letmein|welcome|changeme|default|test|abc123|password1)([\b$]|$)'
  filter_legit:
    command: 're:(?i)(?<![A-Za-z0-9_])(sshd|sudo|google_authenticator|pam_unix|kbdInteractiveAuthentication|kerberos|kinit|keychain)(?![A-Za-z0-9_])'
  condition: selection and (selection_bruteforce_tool or selection_default_credential) and not filter_legit
  timeframe: 24h
  count: 1
cooldown_sec: 1800
dedup_key: "{{user}}:{{source_ip}}"
name: security-audit

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "server/pyproject.toml"
      - "server/requirements.lock"
      - "agent/go.mod"
      - "agent/go.sum"
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  pip-audit-server:
    name: pip-audit (server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install server deps
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pip-audit>=2.7,<3"
      - name: Run pip-audit and emit SARIF
        working-directory: server
        run: pip-audit --strict --format=sarif --output=pip-audit.sarif
      - name: Upload pip-audit SARIF
        if: always() && hashFiles('server/pip-audit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: server/pip-audit.sarif
          category: pip-audit

  govulncheck-agent:
    name: govulncheck (agent)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: agent/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck ./...
        run: govulncheck ./...

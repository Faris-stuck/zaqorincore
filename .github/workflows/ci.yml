name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (linux/amd64, Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        working-directory: agent
        run: go mod verify

      - name: go vet
        working-directory: agent
        run: go vet ./...

      - name: go test -race
        working-directory: agent
        run: go test -race -count=1 -timeout=240s ./...

      - name: Build static binary
        working-directory: agent
        run: make build

      - name: Verify binary is static + size
        working-directory: agent
        run: |
          file bin/zaqorin-agent
          SIZE=$(stat -c %s bin/zaqorin-agent)
          echo "binary size: $SIZE bytes"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::error::Binary exceeds 15 MB target"
            exit 1
          fi

  smoke:
    name: smoke (end-to-end via websocat)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build agent
        working-directory: agent
        run: make build

      - name: Install websocat
        run: |
          curl -fsSL https://github.com/vi/websocat/releases/download/v1.13.0/websocat.x86_64-unknown-linux-musl \
            -o /tmp/websocat
          chmod +x /tmp/websocat
          /tmp/websocat --version

      - name: Run smoke
        working-directory: agent
        env:
          WEBSOCAT_BIN: /tmp/websocat
        run: bash scripts/smoke.sh

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run rules tests
        working-directory: server
        run: pytest tests/rules/ -q
      - name: Run integration tests
        working-directory: server
        run: pytest tests/integration/ -q
      - name: Lint
        working-directory: server
        run: |
          pip install ruff
          ruff check src/ tests/
      - name: Secret scan
        run: |
          pip install gitleaks
          gitleaks detect --no-git --source . --redact --report-path /tmp/gitleaks.json || true
          if [ -s /tmp/gitleaks.json ]; then
            echo "::error::Secrets found"
            cat /tmp/gitleaks.json
            exit 1
          fi
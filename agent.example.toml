# ZaqorinCore agent configuration template.
# The shared HMAC secret is stored separately at state_dir/secret.

[connection]
# Connection fields are kept at the root for compatibility with the loader.
server_url = "wss://zaqorin.example.com:8443/ws/agent"
agent_id = "auto"
auth_token = "unused-legacy-field"

log_level = "info"
state_dir = "/var/lib/zaqorin-agent"
dry_run = true

[[log_source]]
name = "auth"
path = "/var/log/auth.log"

[[log_source]]
name = "nginx_access"
path = "/var/log/nginx/access.log"

[windows_eventlog]
mode = "pull"

[response]
# Explicit local policy. New action kinds are denied unless enabled here.
allow_block_ip = true
allow_tarpit_ip = false
allow_isolate_host = false
allow_kill_process = false
allow_quarantine_file = false
allow_revoke_session = false
allow_webhook_soar = false
allow_evidence_capture = false
allow_canary_alert = false
allow_disable_user = false
block_default_ttl_sec = 3600
